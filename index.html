<!DOCTYPE html><html lang="fa" dir="rtl">
<head>

    * {
      box-sizing: border-box;

      direction: ltr;

    }

      font-family: Tahoma, Arial, sans-serif;

    }

        padding: 35px 18px;
      }

        font-size: 22px;

>
